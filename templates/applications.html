{% extends 'base.html' %}{% block content %}<h2>Applications</h2><div class="card p-3 mb-4"><form method="post" action="/applications/add" class="row g-2"><div class="col-md-5"><select name="student_id" class="form-select" required><option value="">Student</option>{% for s in students %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></div><div class="col-md-5"><select name="company_id" class="form-select" required><option value="">Company</option>{% for c in companies %}<option value="{{c.id}}">{{c.name}} — {{c.role}}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary w-100">Apply</button></div></form></div><table class="table"><tr><th>Student</th><th>Company</th><th>Role</th><th>Status</th></tr>{% for a in applications %}<tr><td>{{a.student_name}}</td><td>{{a.company_name}}</td><td>{{a.role}}</td><td>{{a.status}}</td></tr>{% endfor %}</table>{% endblock %}
